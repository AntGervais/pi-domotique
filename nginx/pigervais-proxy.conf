# Reverse proxy pigervais — URLs propres pour les services du Pi.
#
# NE PAS EDITER SUR LE PI : ce fichier est gere depuis le miroir
# ~/pigervais/nginx/pigervais-proxy.conf sur le Mac, et sera ecrase
# au prochain `pi-push`. Editer la, puis pousser.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # --- Zigbee2MQTT (base_url=/zigbee : pas de strip) ---
    location /zigbee {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Node-RED (httpRoot=/nodered : pas de strip, WebSocket) ---
    location /nodered {
        proxy_pass http://127.0.0.1:1880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Pi-hole (prefix=/pihole : strip via slash final) ---
    location /pihole/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /pihole { return 301 /pihole/admin/; }

    location = / { return 302 /pihole/admin/; }

    # Favicon thermometre pour le dashboard Node-RED. Le JS du dashboard D2.0
    # calcule ses liens d'icone a partir de `ui-base.path` ("/dashboard") tout
    # seul, sans savoir qu'il tourne derriere le prefixe nginx /nodered : le
    # navigateur demande donc /dashboard/favicon.{ico,svg} et
    # /dashboard/apple-touch-icon.png. `types {}` est indispensable : nginx
    # choisit le Content-Type d'apres l'EXTENSION de l'URL (via sa table MIME
    # globale), pas d'apres `default_type`, qui ne sert que de repli pour une
    # extension inconnue — sans ca, .ico repond en `image/x-icon` avec un
    # corps SVG, le navigateur voit un type incoherent et ignore l'icone.
    location ~ ^/dashboard/(favicon\.ico|favicon\.svg|apple-touch-icon\.png)$ {
        types { image/svg+xml ico svg png; }
        default_type image/svg+xml;
        add_header Cache-Control "no-store";
        return 200 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="78" font-size="80">🌡️</text></svg>';
    }
}

# --- Vhost dedie au tunnel Cloudflare (maison.gervais.click) ---
#
# Ecoute uniquement sur la loopback : seul cloudflared peut l'atteindre, il
# n'est pas joignable depuis le LAN. Il n'expose QUE le dashboard : l'editeur
# Node-RED est sans mot de passe et l'admin Pi-hole ne doit pas sortir, donc
# tout ce qui n'est pas /nodered/dashboard renvoie 404. Le dashboard D2.0 ne
# reference que des chemins relatifs (./assets/...), il tient donc entierement
# dans ce prefixe.
server {
    listen 127.0.0.1:8082;
    server_name _;

    # INDISPENSABLE ici : sans ca, nginx transforme un `return 302 /chemin` en
    # URL absolue en y collant son propre scheme et son propre port d'ecoute,
    # ce qui donnait http://maison.gervais.click:8082/... — injoignable depuis
    # Internet, puisque 8082 n'ecoute que sur la loopback. Avec absolute_redirect
    # off, le Location reste relatif et c'est le navigateur qui le resout contre
    # https://maison.gervais.click.
    absolute_redirect off;

    location /nodered/dashboard {
        proxy_pass http://127.0.0.1:1880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Favicon thermometre : voir le commentaire du vhost LAN (meme piege de
    # Content-Type par extension, meme correction via `types {}`).
    location ~ ^/dashboard/(favicon\.ico|favicon\.svg|apple-touch-icon\.png)$ {
        types { image/svg+xml ico svg png; }
        default_type image/svg+xml;
        add_header Cache-Control "no-store";
        return 200 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="78" font-size="80">🌡️</text></svg>';
    }

    # URLs courtes pour l'usage quotidien. On ne peut PAS servir le dashboard
    # a la racine : ui_base.js calcule le chemin de la websocket cote serveur
    # (join(httpNodeRoot, config.path, 'socket.io')) et l'envoie au client en
    # absolu, donc le rebaser demanderait de contrefaire ce chemin et casserait
    # a la prochaine mise a jour du paquet. Une redirection suffit.
    location = / { return 302 /nodered/dashboard/home; }
    location = /home { return 302 /nodered/dashboard/home; }
    location / { return 404; }
}
